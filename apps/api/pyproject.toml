[project]
name = "havenid-api"
version = "0.1.0"
description = "HavenID FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "aiosqlite>=0.20.0",
  "greenlet>=3.1.0",
  "alembic>=1.14.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  "argon2-cffi>=23.1.0",
  "pyotp>=2.9.0",
  "qrcode>=8.0",
  "webauthn>=2.2.0",
  "cryptography>=44.0.0",
  "redis>=5.2.0",
  "twilio>=9.4.0",
  "phonenumbers>=8.13.0",
  "vobject>=0.9.7",
  "httpx>=0.28.0",
  "python-multipart>=0.0.17",
  "pyjwt>=2.10.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers", "app.lists", "app.pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
